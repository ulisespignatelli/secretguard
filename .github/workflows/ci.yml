name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: Formato
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
            go-version: stable   # govulncheck necesita la última versión de Go
      - name: Vulnerabilidades conocidas (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: secretguard se escanea a sí mismo
        uses: ./
        with:
          fail-on: baja
      - name: Subir resultados a la pestaña Security
        if: always() && hashFiles('secretguard.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: secretguard.sarif
